name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # el equipo trabaja en Windows (codificación cp1252)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # misma versión que Google Colab
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Descargar pesos del modelo (verifica SHA-256)
        run: python scripts/descargar_modelo.py

      - name: Pruebas
        run: python -m pytest -q -rs
